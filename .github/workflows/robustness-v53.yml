name: V5.3 Frozen Historical Robustness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - robustness_v53.py
      - test_v53.py
      - .github/workflows/robustness-v53.yml

permissions:
  contents: read

jobs:
  historical-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run focused tests
        run: python -m unittest -v test_v53.py test_v52.py test_research_protocol_v47.py test_v46.py test_v21.py
      - name: Run frozen historical robustness
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python robustness_v53.py
      - name: Upload V5.3 robustness results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v53-robustness-results
          path: robustness_results_v53/
          if-no-files-found: warn
