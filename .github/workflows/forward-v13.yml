name: V1.3 Forward Scanner

on:
  workflow_dispatch:

  schedule:
    # Runs every 5 minutes during the broad US market window.
    # The Python script itself enforces the actual 9:45-11:20 ET scan window.
    - cron: "*/5 13-16 * * 1-5"

permissions:
  contents: read

concurrency:
  group: v13-forward-discord-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore bot state
        uses: actions/cache/restore@v5
        with:
          path: .bot_state
          key: v13-forward-state-${{ github.run_id }}
          restore-keys: |
            v13-forward-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run notification tests
        run: python -m unittest -v test_discord_notifications.py

      - name: Run V1.3 forward scanner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TRADIER_SANDBOX_TOKEN: ${{ secrets.TRADIER_SANDBOX_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python tradier_v13_bot.py

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .bot_state
          key: v13-forward-state-${{ github.run_id }}
