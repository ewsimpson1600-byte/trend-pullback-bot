name: Tradier Sandbox Round Trip

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roundtrip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Tradier sandbox round-trip test
        env:
          TRADIER_SANDBOX_TOKEN: ${{ secrets.TRADIER_SANDBOX_TOKEN }}
          TRADIER_SANDBOX_ACCOUNT: ${{ secrets.TRADIER_SANDBOX_ACCOUNT }}
        run: |
          python tradier_roundtrip_test.py
