name: V2.9 Early-Failure-Exit ETF Mean Reversion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - develop_v29.py
      - test_v29.py
      - .github/workflows/develop-v29.yml

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore daily ETF cache
        uses: actions/cache/restore@v5
        with:
          path: backtest_data_v21_daily
          key: v21-daily-etf-${{ github.run_id }}
          restore-keys: |
            v21-daily-etf-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests
      - name: Run unit tests
        run: >-
          python -m unittest -v
          test_v29.py test_v28.py test_v27.py test_v26.py test_v25.py
          test_v24.py test_v23.py test_v22.py test_v21.py
      - name: Run V2.9 frozen development and locked validation
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python develop_v29.py
      - name: Save daily ETF cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: backtest_data_v21_daily
          key: v21-daily-etf-${{ github.run_id }}
      - name: Upload V2.9 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v29-results
          path: backtest_results_v29/
          if-no-files-found: warn
