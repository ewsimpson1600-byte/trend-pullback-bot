name: V5.0 Two-Year NR7 Screen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - screen_v50.py
      - test_v50.py
      - .github/workflows/screen-v50.yml

permissions:
  contents: read

jobs:
  two-year-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run focused tests
        run: python -m unittest -v test_v50.py test_research_protocol_v47.py test_v46.py test_v21.py
      - name: Run frozen two-year screen
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python screen_v50.py
      - name: Upload V5.0 screen results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v50-screen-results
          path: screen_results_v50/
          if-no-files-found: warn
