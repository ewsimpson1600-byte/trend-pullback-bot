name: V4.0 Blocked Unchanged V3.4 Robustness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - develop_v40.py
      - test_v40.py
      - .github/workflows/develop-v40.yml

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v5
        with:
          path: backtest_data_v32_history
          key: v32-history-${{ github.run_id }}
          restore-keys: |
            v32-history-
      - uses: actions/cache/restore@v5
        with:
          path: backtest_data_v33_history
          key: v33-history-${{ github.run_id }}
          restore-keys: |
            v33-history-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests
      - name: Run unit tests
        run: >-
          python -m unittest -v test_v40.py test_v39.py test_v38.py test_v37.py
          test_v36.py test_v35.py test_v34.py test_v33.py test_v32.py test_v31.py
          test_v30.py test_v29.py test_v28.py test_v27.py test_v26.py test_v25.py
          test_v24.py test_v23.py test_v22.py test_v21.py
      - name: Run V4.0 blocked robustness screen
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python develop_v40.py
      - name: Upload V4.0 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v40-results
          path: backtest_results_v40/
          if-no-files-found: warn
