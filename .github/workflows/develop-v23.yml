name: V2.3 Confirmed-Reversal ETF Mean Reversion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - develop_v23.py
      - test_v23.py
      - .github/workflows/develop-v23.yml

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore daily ETF cache
        uses: actions/cache/restore@v5
        with:
          path: backtest_data_v21_daily
          key: v21-daily-etf-${{ github.run_id }}
          restore-keys: |
            v21-daily-etf-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests
      - name: Run unit tests
        run: >-
          python -m unittest -v
          test_v23.py test_v22.py test_v21.py test_v20.py test_v19.py
          test_v18.py test_v17.py test_v16.py test_v15.py test_v14.py test_v142.py
      - name: Run V2.3 frozen development and locked validation
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python develop_v23.py
      - name: Save daily ETF cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: backtest_data_v21_daily
          key: v21-daily-etf-${{ github.run_id }}
      - name: Upload V2.3 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v23-results
          path: backtest_results_v23/
          if-no-files-found: warn
