name: V5.7 Historical Screen Multiplicity Lock

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - research_protocol_v47.py
      - test_research_governance_v57.py
      - test_research_protocol_v47.py
      - .github/workflows/research-governance-v57.yml
      - README.md

permissions:
  contents: read

jobs:
  governance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependency
        run: pip install pandas
      - name: Verify frozen screen ledger and routing
        run: python -m unittest -v test_research_governance_v57.py test_research_protocol_v47.py
